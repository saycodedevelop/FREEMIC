name: Android checks and automatic prerelease
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: chmod +x gradlew
      - name: Build APK and check lint
        run: ./gradlew :app:assembleDebug :app:lintDebug -PreleaseVersionCode="$GITHUB_RUN_NUMBER" -PreleaseVersionName="0.1.0-dev.$GITHUB_RUN_NUMBER" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeLink-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  portable-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -Iapp/src/main/cpp tests/audio_core_test.cpp -o /tmp/audio-core-test
      - run: /tmp/audio-core-test
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, portable-audio]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KaraokeLink-debug
          path: release
      - name: Publish tested preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_RUN_NUMBER}"
          apk="KaraokeLink-${tag}.apk"
          mv release/app-debug.apk "release/$apk"
          (cd release && sha256sum "$apk" > SHA256SUMS.txt)
          printf '%s\n' 'Automated development preview. Debug-signed APK for testing on Android 9 or newer.' 'Both Android build/lint and portable audio tests passed. Real-device audio testing is still required.' 'Preview signing keys can change between builds; an uninstall may be needed before installing a later preview.' > release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "release/$apk" release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "release/$apk" release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "KaraokeLink $tag" --notes-file release-notes.txt --prerelease
          fi